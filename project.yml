name: StarGazer
options:
  bundleIdPrefix: com.stargazer
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "15.0"

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.0.0"

targets:
  StarGazer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StarGazer
        excludes:
          - "Resources/**"
          - "Assets.xcassets/**"
      - path: StarGazer/Resources/yale_bright_star_catalog.csv
        buildPhase: resources
      - path: StarGazer/Resources/astronomical_events_2026.json
        buildPhase: resources
      - path: StarGazer/Resources/splash.png
        buildPhase: resources
        optional: true
      - path: StarGazer/Resources/iss_icon.png
        buildPhase: resources
        optional: true
      - path: StarGazer/Resources/faceid_screen.png
        buildPhase: resources
        optional: true
      - path: StarGazer/Resources/sun.png
        buildPhase: resources
        optional: true
      - path: StarGazer/Resources/moon.png
        buildPhase: resources
        optional: true
      - path: StarGazer/Resources/mercury.png
        buildPhase: resources
        optional: true
      - path: StarGazer/Resources/venus.png
        buildPhase: resources
        optional: true
      - path: StarGazer/Resources/mars.png
        buildPhase: resources
        optional: true
      - path: StarGazer/Resources/jupiter.png
        buildPhase: resources
        optional: true
      - path: StarGazer/Resources/saturn.png
        buildPhase: resources
        optional: true
      - path: StarGazer/Resources/uranus.png
        buildPhase: resources
        optional: true
      - path: StarGazer/Resources/neptune.png
        buildPhase: resources
        optional: true
      - path: StarGazer/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: Kingfisher
    settings:
      base:
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.stargazer.StarGazer
        PRODUCT_NAME: StarGazer
        INFOPLIST_FILE: StarGazer/Info.plist
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_OPTIMIZATION_LEVEL: "-O"
